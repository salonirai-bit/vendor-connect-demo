<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner Success Agent | Slack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    /* ─── Reset ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Slack dark theme colors */
      --slack-sidebar-bg: #19171D;
      --slack-main-bg: #1A1D21;
      --slack-msg-hover: #222529;
      --slack-text-primary: #D1D2D3;
      --slack-text-secondary: #ABABAD;
      --slack-text-muted: #797C80;
      --slack-link: #1D9BD1;
      --slack-border: #35373b;

      --slack-green: #007A5A;
      --slack-green-hover: #148567;
      --slack-red: #E8596D;

      /* CRM colors */
      --crm-salesforce: #0d9dda;
      --crm-salesforce-bg: rgba(13,157,218,0.12);
      --crm-hubspot: #ff7a59;
      --crm-hubspot-bg: rgba(255,122,89,0.12);
      --crm-copper: #f4a261;
      --crm-copper-bg: rgba(244,162,97,0.12);

      /* Status colors */
      --status-success: #2bac76;
      --status-success-bg: rgba(43,172,118,0.12);
      --status-warning: #e8a820;
      --status-warning-bg: rgba(232,168,32,0.12);

      --font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font-family);
      background: var(--slack-main-bg);
      color: var(--slack-text-primary);
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── Slack Layout ────────────────────────────────────────────── */
    .slack-app {
      display: flex;
      height: 100vh;
    }

    /* ─── Sidebar ─────────────────────────────────────────────────── */
    .sidebar {
      width: 260px;
      background: var(--slack-sidebar-bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--slack-border);
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .workspace-name {
      font-size: 18px;
      font-weight: 900;
      color: white;
    }

    .sidebar-section {
      padding: 8px 0;
    }

    .sidebar-section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--slack-text-muted);
      padding: 4px 16px;
      letter-spacing: 0.5px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 16px;
      font-size: 15px;
      color: var(--slack-text-secondary);
      cursor: pointer;
      transition: background 0.1s;
    }

    .sidebar-item:hover {
      background: rgba(255,255,255,0.04);
    }

    .sidebar-item.active {
      background: #1164A3;
      color: white;
      font-weight: 700;
    }

    .sidebar-item-icon {
      width: 20px;
      text-align: center;
      font-size: 14px;
    }

    /* ─── Main Content ────────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--slack-main-bg);
      min-width: 0;
    }

    /* ─── Channel Header ──────────────────────────────────────────── */
    .channel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--slack-border);
      background: var(--slack-main-bg);
      flex-shrink: 0;
    }

    .channel-avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2d7ff9 0%, #18bfff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .channel-info {
      flex: 1;
    }

    .channel-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--slack-text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(255,255,255,0.08);
      color: var(--slack-text-secondary);
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.4px;
    }

    .channel-subtitle {
      font-size: 13px;
      color: var(--slack-text-muted);
      margin-top: 2px;
    }

    .channel-actions {
      display: flex;
      gap: 4px;
    }

    .channel-action-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--slack-border);
      background: transparent;
      color: var(--slack-text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .channel-action-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--slack-text-primary);
    }

    /* ─── Message Feed ────────────────────────────────────────────── */
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
    }

    .feed::-webkit-scrollbar {
      width: 8px;
    }

    .feed::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
    }

    /* ─── Messages ────────────────────────────────────────────────── */
    .message {
      display: flex;
      gap: 8px;
      padding: 8px 20px;
      transition: background 0.1s;
    }

    .message:hover {
      background: var(--slack-msg-hover);
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .message-avatar.bot {
      background: linear-gradient(135deg, #2d7ff9 0%, #18bfff 100%);
    }

    .message-avatar.user {
      background: linear-gradient(135deg, #e8596d 0%, #f4a261 100%);
      font-size: 14px;
      font-weight: 700;
      color: white;
    }

    .message-body {
      flex: 1;
      min-width: 0;
    }

    .message-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .message-author {
      font-size: 15px;
      font-weight: 900;
      color: var(--slack-text-primary);
    }

    .message-app-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(45,127,249,0.15);
      color: #5b9cf6;
      padding: 2px 5px;
      border-radius: 3px;
      letter-spacing: 0.3px;
    }

    .message-time {
      font-size: 12px;
      color: var(--slack-text-muted);
    }

    .message-text {
      font-size: 15px;
      line-height: 1.46;
      color: var(--slack-text-primary);
    }

    /* ─── Slack Block Kit Cards ───────────────────────────────────── */
    .attachment {
      border-left: 4px solid;
      border-radius: 4px;
      background: rgba(255,255,255,0.03);
      margin-top: 8px;
      overflow: hidden;
    }

    .attachment.salesforce { border-left-color: var(--crm-salesforce); }
    .attachment.hubspot { border-left-color: var(--crm-hubspot); }
    .attachment.copper { border-left-color: var(--crm-copper); }
    .attachment.success { border-left-color: var(--status-success); }

    .attachment-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--slack-border);
    }

    .attachment-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .attachment-body {
      padding: 12px 16px;
    }

    .attachment-section {
      padding: 12px 16px;
      border-top: 1px solid var(--slack-border);
    }

    .attachment-section:first-child {
      border-top: none;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--slack-text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    /* ─── Fields Grid ─────────────────────────────────────────────── */
    .fields {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
    }

    .field-label {
      font-size: 13px;
      color: var(--slack-text-secondary);
      font-weight: 700;
    }

    .field-value {
      font-size: 13px;
      color: var(--slack-text-primary);
    }

    /* ─── Tags ────────────────────────────────────────────────────── */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 16px;
    }

    .tag-salesforce {
      background: var(--crm-salesforce-bg);
      color: var(--crm-salesforce);
    }

    .tag-hubspot {
      background: var(--crm-hubspot-bg);
      color: var(--crm-hubspot);
    }

    .tag-copper {
      background: var(--crm-copper-bg);
      color: var(--crm-copper);
    }

    .tag-success {
      background: var(--status-success-bg);
      color: var(--status-success);
    }

    /* ─── Buttons ─────────────────────────────────────────────────── */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--slack-border);
      border-radius: 4px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--slack-green);
      color: white;
      border-color: var(--slack-green);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--slack-green-hover);
      border-color: var(--slack-green-hover);
    }

    .btn-default {
      background: transparent;
      color: var(--slack-text-primary);
    }

    .btn-default:hover:not(:disabled) {
      background: rgba(255,255,255,0.08);
    }

    .btn-danger {
      background: transparent;
      color: var(--slack-red);
      border-color: var(--slack-red);
    }

    .btn-danger:hover:not(:disabled) {
      background: rgba(232,89,109,0.12);
    }

    /* ─── Opportunity Table ───────────────────────────────────────── */
    .opp-table {
      margin-top: 8px;
    }

    .opp-row {
      display: grid;
      grid-template-columns: 28px 24px 1fr auto auto 20px;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .opp-row:hover {
      background: rgba(255,255,255,0.05);
    }

    .opp-row.selected {
      background: rgba(29,155,209,0.1);
    }

    .opp-checkbox {
      width: 18px;
      height: 18px;
      border: 2px solid var(--slack-border);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .opp-row.selected .opp-checkbox {
      background: var(--slack-link);
      border-color: var(--slack-link);
      color: white;
    }

    .opp-num {
      font-size: 13px;
      color: var(--slack-text-muted);
      font-weight: 700;
      text-align: center;
    }

    .opp-name {
      font-size: 14px;
      color: var(--slack-text-primary);
      font-weight: 500;
    }

    .opp-amount {
      font-size: 14px;
      color: var(--slack-text-primary);
      font-weight: 700;
    }

    .opp-stage {
      font-size: 13px;
      color: var(--slack-text-secondary);
    }

    .opp-source-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .opp-source-dot.salesforce { background: var(--crm-salesforce); }
    .opp-source-dot.hubspot { background: var(--crm-hubspot); }
    .opp-source-dot.copper { background: var(--crm-copper); }

    /* ─── Selection Summary ───────────────────────────────────────── */
    .selection-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      margin-top: 8px;
      background: rgba(29,155,209,0.08);
      border: 1px solid rgba(29,155,209,0.2);
      border-radius: 6px;
    }

    .selection-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--slack-link);
    }

    /* ─── Pagination ──────────────────────────────────────────────── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }

    .page-info {
      font-size: 13px;
      color: var(--slack-text-muted);
    }

    /* ─── Filter Chips ────────────────────────────────────────────── */
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--slack-border);
      border-radius: 16px;
      padding: 4px 10px;
    }

    .filter-chip-remove {
      cursor: pointer;
      color: var(--slack-text-muted);
    }

    .filter-chip-remove:hover {
      color: var(--slack-red);
    }

    /* ─── Typing Indicator ────────────────────────────────────────── */
    .typing {
      display: flex;
      gap: 8px;
      padding: 8px 20px;
      align-items: center;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background: var(--slack-text-muted);
      border-radius: 50%;
      animation: typingBounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* ─── Composer ────────────────────────────────────────────────── */
    .composer {
      padding: 20px;
      border-top: 1px solid var(--slack-border);
      background: var(--slack-main-bg);
    }

    .composer-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--slack-border);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .composer-input {
      flex: 1;
      font-family: var(--font-family);
      font-size: 15px;
      color: var(--slack-text-primary);
      background: transparent;
      border: none;
      outline: none;
    }

    .composer-input::placeholder {
      color: var(--slack-text-muted);
    }

    .composer-send {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--slack-green);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      opacity: 0.5;
    }

    .composer-send.active {
      opacity: 1;
    }

    .composer-send:hover {
      background: var(--slack-green-hover);
    }

    .composer-send svg {
      width: 16px;
      height: 16px;
    }

    /* ─── Bullet List ─────────────────────────────────────────────── */
    .bullet-list {
      list-style: none;
      padding: 0;
    }

    .bullet-list li {
      font-size: 13px;
      color: var(--slack-text-primary);
      padding: 3px 0;
      padding-left: 16px;
      position: relative;
    }

    .bullet-list li::before {
      content: '\2022';
      position: absolute;
      left: 4px;
      color: var(--slack-text-muted);
    }

    /* ─── Status Row ──────────────────────────────────────────────── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 3px 0;
    }

    .status-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    /* ─── Confirm Item ────────────────────────────────────────────── */
    .confirm-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 14px;
    }

    .confirm-item-num {
      color: var(--slack-text-muted);
      font-weight: 700;
      width: 24px;
    }

    .confirm-item-source {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .confirm-item-source.salesforce { background: var(--crm-salesforce); }
    .confirm-item-source.hubspot { background: var(--crm-hubspot); }
    .confirm-item-source.copper { background: var(--crm-copper); }

    /* ─── Setup Modal ─────────────────────────────────────────────── */
    .slack-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .slack-modal-overlay.hidden { display: none; }

    .slack-modal {
      background: #1a1d21;
      border: 1px solid #35373b;
      border-radius: 12px;
      width: 520px;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .slack-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid #35373b;
    }

    .slack-modal-title {
      font-size: 18px;
      font-weight: 900;
      color: #d1d2d3;
    }

    .slack-modal-close {
      background: none;
      border: none;
      color: #797c80;
      font-size: 20px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slack-modal-close:hover { background: rgba(255,255,255,0.08); }

    .slack-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .slack-modal-footer {
      padding: 16px 24px;
      border-top: 1px solid #35373b;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .crm-connect-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border: 1px solid #35373b;
      border-radius: 8px;
      margin-bottom: 12px;
      transition: border-color 0.2s, background 0.2s;
    }

    .crm-connect-card.connected {
      border-color: #2bac76;
      background: rgba(43, 172, 118, 0.08);
    }

    .crm-connect-card-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .crm-connect-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .crm-connect-card-name {
      font-weight: 700;
      font-size: 15px;
      color: #d1d2d3;
    }

    .crm-connect-card-desc {
      font-size: 12px;
      color: #797c80;
      margin-top: 2px;
    }

    .crm-connect-card-status {
      font-size: 13px;
      color: #2bac76;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ─── Modal Buttons ───────────────────────────────────────────── */
    .modal-btn {
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .modal-btn-primary {
      background: #007a5a;
      color: white;
    }
    .modal-btn-primary:hover:not(:disabled) { background: #148567; }
    .modal-btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .modal-btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #d1d2d3;
      border: 1px solid #35373b;
    }
    .modal-btn-secondary:hover { background: rgba(255,255,255,0.1); }

    .modal-btn-danger {
      background: transparent;
      color: #e8596d;
    }

    /* ─── Modal Select ────────────────────────────────────────────── */
    .modal-select {
      width: 100%;
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      background: #222529;
      color: #d1d2d3;
      border: 1px solid #35373b;
      border-radius: 6px;
      padding: 8px 12px;
      margin-top: 6px;
    }

    .modal-field-label {
      font-size: 13px;
      font-weight: 700;
      color: #ababad;
      display: block;
      margin-bottom: 4px;
    }

    .modal-field-group {
      margin-bottom: 20px;
    }

    /* ─── Card Styles ─────────────────────────────────────────────── */
    .card {
      border-left: 4px solid;
      border-radius: 4px;
      background: rgba(255,255,255,0.03);
      padding: 12px 16px;
    }

    .card.card-success {

      const m = String(now.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${m} ${ampm}`;
    }

    function formatAmount(amount) {
      if (amount >= 1000000) return `$${(amount / 1000000).toFixed(1)}M`;
      if (amount >= 1000) return `$${Math.round(amount / 1000)}K`;
      return `$${amount.toLocaleString()}`;

      let result = [...OPPORTUNITIES];
      const f = STATE.filters;
      if (f.source) result = result.filter(o => o.source === f.source);
      if (f.stage) result = result.filter(o => o.stage === f.stage);
      if (f.amountMin) result = result.filter(o => o.amount >= f.amountMin);
      return result;
    }

      const filtered = getFilteredOpportunities();
      const start = STATE.page * STATE.pageSize;
      return filtered.slice(start, start + STATE.pageSize);

      return Math.ceil(getFilteredOpportunities().length / STATE.pageSize);

      STATE.selectedIds.forEach(id => {

      return total;

    // ═══════════════════════════════════════════════════════════════════
    // NATURAL LANGUAGE FILTER PARSER
    // ═══════════════════════════════════════════════════════════════════
    function parseNaturalFilter(text) {
      const filters = {};
      if (/salesforce|sf\b/i.test(text)) filters.source = 'salesforce';
      else if (/hubspot|hs\b/i.test(text)) filters.source = 'hubspot';
      else if (/copper/i.test(text)) filters.source = 'copper';

      const amountMatch = text.match(/(?:over|above|>|more than)\s*\$?([\d,.]+)\s*(k|m)?/i);
      if (amountMatch) {
        let val = parseFloat(amountMatch[1].replace(/,/g, ''));
        const unit = (amountMatch[2] || '').toLowerCase();
        if (unit === 'k') val *= 1000;
        if (unit === 'm') val *= 1000000;
        filters.amountMin = val;
      }

      if (/negotiation/i.test(text)) filters.stage = 'Negotiation';
      else if (/proposal/i.test(text)) filters.stage = 'Proposal';
      else if (/approved/i.test(text)) filters.stage = 'Approved';
      else if (/discovery/i.test(text)) filters.stage = 'Discovery';
      else if (/submitted/i.test(text)) filters.stage = 'Submitted';
      else if (/review/i.test(text)) filters.stage = 'Under Review';

      return Object.keys(filters).length > 0 ? filters : null;
    }

    // ═══════════════════════════════════════════════════════════════════
    // INPUT ROUTING
    // ═══════════════════════════════════════════════════════════════════
    function processInput(text) {
      if (isProcessing || !text.trim()) return;
      isProcessing = true;
      text = text.trim();

      disableAllButtons();
      renderUserMessage(text);
      inputEl.value = '';
      sendBtn.classList.remove('active');

      // Handle setup mode
      if (STATE.mode === 'setup') {
        const lower = text.toLowerCase();
        if (/skip|later|no thanks/i.test(lower)) {
          skipSetup();
          isProcessing = false;
          return;
        }
      }

      if (STATE.mode === 'browse') {
        const numMatch = text.match(/^[\d,\s]+$/);
        if (numMatch) {
          const nums = text.split(/[,\s]+/).map(n => parseInt(n)).filter(n => !isNaN(n));
          const filtered = getFilteredOpportunities();
          const start = STATE.page * STATE.pageSize;
          nums.forEach(n => {
            const idx = start + n - 1;
            if (idx >= 0 && idx < filtered.length) {
              const opp = filtered[idx];
              if (STATE.selectedIds.has(opp.id)) {
                STATE.selectedIds.delete(opp.id);
              } else {
                STATE.selectedIds.add(opp.id);
              }
            }
          });
          showTypingIndicator();
          setTimeout(() => {
            hideTypingIndicator();
            renderBrowseList();
            isProcessing = false;
          }, 400);
          return;
        }

        const lower = text.toLowerCase();
        if (lower === 'n' || lower === 'next') {
          handlePageNext(); isProcessing = false; return;
        }
        if (lower === 'p' || lower === 'prev' || lower === 'previous') {
          handlePagePrev(); isProcessing = false; return;
        }
        if (lower === 'a' || lower === 'select all') {
          handleSelectAll(); isProcessing = false; return;
        }
        if (lower === 'c' || lower === 'clear') {
          handleClearSelection(); isProcessing = false; return;
        }
        if (lower === 's' || /^sync/i.test(lower)) {
          if (STATE.selectedIds.size > 0) {
            handleSyncSelected(); isProcessing = false; return;
          }
        }
        if (lower === 'f' || lower === 'filter') {
          handleFilterStart(); isProcessing = false; return;
        }
        if (lower === 'y' || lower === 'yes' || lower === 'confirm') {
          if (STATE.browsePhase === 'confirm') {
            handleConfirmSync(); isProcessing = false; return;
          }
        }
        if (lower === 'x' || lower === 'cancel') {
          handleCancel(); isProcessing = false; return;
        }
        if (lower === 'e' || lower === 'edit') {
          handleEditSelection(); isProcessing = false; return;
        }
        if (lower === 'm' || lower === 'more' || lower === 'sync more') {
          handleSyncMore(); isProcessing = false; return;
        }
        if (lower === 'd' || lower === 'done') {
          handleDone(); isProcessing = false; return;
        }
      }

      if (/^browse|^b$/i.test(text)) {
        STATE.mode = 'browse';
        STATE.browsePhase = 'entry';
        showTypingIndicator();
        setTimeout(() => {
          hideTypingIndicator();
          renderBrowseEntry();
          isProcessing = false;
        }, 600);
        return;
      }

      const nlFilters = parseNaturalFilter(text);
      if (nlFilters && /deal|opportunit|show|filter/i.test(text)) {
        STATE.mode = 'browse';
        STATE.browsePhase = 'list';
        STATE.filters = nlFilters;
        STATE.page = 0;
        showTypingIndicator();
        setTimeout(() => {
          hideTypingIndicator();
          renderBrowseList();
          isProcessing = false;
        }, 700);
        return;
      }

      if (/browse opportunities|browse all/i.test(text)) {
        STATE.mode = 'browse';
        STATE.browsePhase = 'entry';
        showTypingIndicator();
        setTimeout(() => {
          hideTypingIndicator();
          renderBrowseEntry();
          isProcessing = false;
        }, 600);
        return;
      }

      let matchedTurn = null;
      for (let i = 1; i < TURNS.length; i++) {
        if (TURNS[i].trigger && TURNS[i].trigger.test(text)) {
          matchedTurn = TURNS[i];
          break;
        }
      }

      if (!matchedTurn) {
        showTypingIndicator();
        setTimeout(() => {
          hideTypingIndicator();
          const content = `
            <div class="message-text">I can help you with that! Try one of these:</div>
            <div class="actions">
              <button class="btn btn-default" onclick="handleSuggestion('Browse opportunities')">Browse opportunities</button>
              <button class="btn btn-default" onclick="handleSuggestion('Get my most recent deal')">Get my most recent deal</button>
              <button class="btn btn-default" onclick="handleSuggestion('Check sync status')">Check sync status</button>
            </div>
          `;
          renderAgentMessage(content);
          isProcessing = false;
        }, 600);
        return;
      }

      STATE.mode = 'scripted';
      showTypingIndicator();
      const delay = 800 + Math.random() * 600;
      setTimeout(() => {
        hideTypingIndicator();
        renderScriptedAgentMessage(matchedTurn);
        isProcessing = false;
      }, delay);
    }

    function handleSuggestion(text) {
      processInput(text);
    }

    // ═══════════════════════════════════════════════════════════════════
    // EVENT LISTENERS
    // ═══════════════════════════════════════════════════════════════════
    inputEl.addEventListener('input', () => {
      sendBtn.classList.toggle('active', inputEl.value.trim().length > 0);
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        processInput(inputEl.value);
      }
    });

    sendBtn.addEventListener('click', () => {
      processInput(inputEl.value);
    });

    // ═══════════════════════════════════════════════════════════════════
    // INITIALIZE
    // ═══════════════════════════════════════════════════════════════════
    window.addEventListener('DOMContentLoaded', () => {
      renderSetupWelcome();
    });
  </script>

  <!-- Setup Modal -->
  <div id="setup-modal" class="slack-modal-overlay hidden">
    <div class="slack-modal">
      <div class="slack-modal-header">
        <h2 class="slack-modal-title" id="modal-title">Connect Your CRMs</h2>
        <button class="slack-modal-close" onclick="closeSetupModal()">✕</button>
      </div>
      <div class="slack-modal-body" id="modal-body"></div>
      <div class="slack-modal-footer" id="modal-footer"></div>
    </div>
  </div>
</body>
</html>
